name: Deploy WebGL to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Builds/WebGL/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify WebGL build
        run: test -f Builds/WebGL/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
